<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVOA — EC Issues</title>
<style>
:root{--navy:#173b57;--gold:#c8a24d;--bg:#f5f7f9;--text:#243746;--muted:#72808c;--line:#dfe6eb;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--text)}
.header{background:linear-gradient(135deg,#173b57,#245979);color:#fff;padding:28px 20px}
.header-inner{max-width:1100px;margin:auto}
h1{margin:0;font-size:25px;letter-spacing:.2px}
.subtitle{margin-top:6px;opacity:.78;font-size:13px}
.container{max-width:1100px;margin:25px auto;padding:0 16px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.count{font-size:13px;color:var(--muted)}
select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 14px;color:var(--navy);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 5px 18px rgba(23,59,87,.06)}
table{width:100%;border-collapse:collapse}
th{background:#eef3f6;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:13px}
td{padding:14px 13px;border-top:1px solid var(--line);font-size:13px;vertical-align:top;line-height:1.45}
tr:hover td{background:#fafcfd}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700}
.high{background:#fde8e8;color:#a43b3b} .medium{background:#fff3d8;color:#86621d} .low{background:#e6f5ed;color:#20704d}
.empty{padding:35px;text-align:center;color:var(--muted)}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:25px}
@media(max-width:700px){th:nth-child(1),td:nth-child(1){display:none} th,td{padding:10px 8px;font-size:12px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
<h1>Aurum Villas Owners Association</h1>
<div class="subtitle">Executive Committee — Issues & Updates</div>
</div></header>
<main class="container">
<div class="topbar">
<div class="count" id="count"></div>
<select id="filter" onchange="render()">
<option value="All">All Impact Levels</option>
<option value="High">High Impact</option>
<option value="Medium">Medium Impact</option>
<option value="Low">Low Impact</option>
</select>
</div>
<div class="card">
<table>
<thead><tr><th>Sl. No.</th><th>Date</th><th>Priority / Impact</th><th>Issues</th><th>Remarks</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</main>
<div class="footer">AVOA EC Issues • Updated from the latest committed Excel data</div>
<script src="data.js"></script>
<script>
function render(){
 const filter=document.getElementById('filter').value;
 const data=filter==='All'?issues:issues.filter(x=>x.impact===filter);
 document.getElementById('count').textContent=data.length+' issue'+(data.length===1?'':'s');
 document.getElementById('tbody').innerHTML=data.length?data.map(x=>`
 <tr>
 <td>${x.serial}</td><td>${x.date}</td>
 <td><span class="badge ${x.impact.toLowerCase()}">${x.impact}</span></td>
 <td>${escapeHtml(x.issue)}</td><td>${escapeHtml(x.remarks)}</td>
 </tr>`).join(''):'<tr><td colspan="5" class="empty">No issues found for this impact level.</td></tr>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
render();
</script>
</body>
</html>
