<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurum Villas Owners Association - Dashboard</title>
    <style>
        :root {
            --bg-canvas: #f3f4f6;
            --surface: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-clean: #e5e7eb;
            --brand-gold: #c5a830;
            --brand-dark: #1f2937;
            
            /* Priority Matrix Color tokens */
            --high-bg: #fee2e2;     --high-txt: #991b1b;
            --med-bg: #fef3c7;      --med-txt: #92400e;
            --low-bg: #f3f4f6;      --low-txt: #374151;
            
            /* Status Matrix Color tokens */
            --prog-bg: #ffedd5;     --prog-txt: #c2410c;
            --hold-bg: #f1f5f9;     --hold-txt: #475569;
            --res-bg: #dcfce7;      --res-txt: #15803d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-card {
            max-width: 1200px;
            width: 100%;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            border: 1px solid var(--border-clean);
        }

        .header-banner {
            background-color: var(--brand-dark);
            padding: 32px 40px;
            border-bottom: 4px solid var(--brand-gold);
        }

        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: left;
        }

        .sub-bar {
            color: #9ca3af;
            font-size: 0.875rem;
            margin-top: 4px;
        }

        .workspace {
            padding: 32px 40px;
        }

        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 20px;
            background: #fafafa;
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid var(--border-clean);
        }

        .filter-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-clean);
            background-color: var(--surface);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        select:focus {
            border-color: var(--brand-gold);
            box-shadow: 0 0 0 3px rgba(197, 168, 48, 0.15);
        }

        .sync-indicator {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulseFrame 2s infinite;
        }

        @keyframes pulseFrame {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
        }

        th {
            background-color: #f9fafb;
            color: #4b5563;
            padding: 16px 20px;
            font-weight: 600;
            border-bottom: 2px solid var(--border-clean);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-clean);
            font-size: 0.925rem;
            color: #374151;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f9fafb;
        }

        /* Pill Badge Architecture */
        .pill {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Priorities mapping rules */
        .p-high { background-color: var(--high-bg); color: var(--high-txt); }
        .p-medium { background-color: var(--med-bg); color: var(--med-txt); }
        .p-low { background-color: var(--low-bg); color: var(--low-txt); }

        /* Statuses mapping rules */
        .s-inprogress { background-color: var(--prog-bg); color: var(--prog-txt); }
        .s-hold { background-color: var(--hold-bg); color: var(--hold-txt); }
        .s-resolved { background-color: var(--res-bg); color: var(--res-txt); }

        .empty-view {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="header-banner">
        <h1>Aurum Villas Owners Association</h1>
        <div class="sub-bar">Real-time Community Infrastructure Management Console</div>
    </div>
    
    <div class="workspace">
        <div class="controls-panel">
            <div class="filter-wrapper">
                <label for="priorityFilter">Filter Priority</label>
                <select id="priorityFilter" onchange="renderMatrix()">
                    <option value="All">All Priorities</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <div class="sync-indicator">
                <span class="pulse-dot"></span> Live updates synchronized with issues.txt
            </div>
        </div>

        <div class="table-responsive">
            <table id="associationTable">
                <thead>
                    <tr>
                        <th style="width: 7%">Sr. No</th>
                        <th style="width: 12%">Date</th>
                        <th style="width: 12%">Priority</th>
                        <th style="width: 14%">Status</th>
                        <th style="width: 32%">Issue Description</th>
                        <th style="width: 23%">Operational Comments</th>
                    </tr>
                </thead>
                <tbody id="matrixContainer">
                    <!-- Dynamic rendering engine target -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let localDataset = [];
    const sourceFilePath = 'issues.txt';

    async function synchronizeFeed() {
        try {
            const cacheBusterUrl = sourceFilePath + '?cache=' + new Date().getTime();
            const response = await fetch(cacheBusterUrl);
            if (!response.ok) throw new Error('Network file access denied');
            const visualText = await response.text();
            processTextMatrix(visualText);
            renderMatrix();
        } catch (err) {
            console.error('Synchronization failure:', err);
        }
    }

    function processTextMatrix(textData) {
        const lines = textData.split('\n');
        localDataset = [];

        lines.forEach(row => {
            if (!row.trim()) return;

            // Updated fixed-width spacing slicing rules targeting Notepad matrix columns
            const srNo = row.substring(0, 5).trim();
            const date = row.substring(5, 18).trim();
            const priority = row.substring(18, 28).trim();
            const status = row.substring(28, 43).trim();
            const issue = row.substring(43, 83).trim();
            const comments = row.substring(83).trim();

            if (srNo && date && priority && status && issue) {
                localDataset.push({ srNo, date, priority, status, issue, comments });
            }
        });

        // Force Descending sort array allocation ordering (Newest serial records instantly top first)
        localDataset.sort((x, y) => y.srNo.localeCompare(x.srNo, undefined, {numeric: true, sensitivity: 'base'}));
    }
